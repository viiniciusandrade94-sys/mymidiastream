<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.Y.MidiaStream - Pro & Sync Streaming</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS para conexões P2P WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-dark-custom { background-color: #0d1117; }
    .bg-card-custom { background-color: #161b22; }
    .border-custom { border-color: #30363d; }
    @keyframes floatUp {
      0% { transform: translateY(0px) scale(0.8); opacity: 1; }
      100% { transform: translateY(-350px) scale(1.4); opacity: 0; }
    }
    .floating-emoji { animation: floatUp 2.5s ease-out forwards; pointer-events: none; position: absolute; bottom: 20px; z-index: 50; }

    /* Ajuste de Fullscreen Real no Vídeo */
    :fullscreen video, :-webkit-full-screen video {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      object-fit: contain !important;
    }
    :fullscreen, :-webkit-full-screen {
      background-color: black !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
  </style>
</head>
<body class="bg-dark-custom text-gray-200 min-h-screen flex flex-col font-sans relative overflow-x-hidden">

  <!-- Modal / Ecrã Inicial de Autenticação -->
  <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-card-custom border border-custom rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="text-center mb-4">
        <div class="inline-block p-3 bg-indigo-500/10 text-indigo-400 rounded-full mb-2 border border-indigo-500/20">
          <i class="fa-solid fa-play-circle text-3xl"></i>
        </div>
        <h2 class="text-xl font-bold text-white">M.Y.<span class="text-indigo-400">MidiaStream</span></h2>
        <p class="text-xs text-gray-400 mt-1">Aceda com o seu e-mail ou crie uma conta para entrar.</p>
      </div>

      <!-- Abas Login / Registo -->
      <div class="flex bg-dark-custom p-1 rounded-xl border border-custom mb-4">
        <button id="tabLoginBtn" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Entrar</button>
        <button id="tabRegisterBtn" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <div id="formLogin" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">E-mail:</label>
          <input id="loginEmail" type="email" placeholder="seu@email.com" class="w-full bg-dark-custom border border-custom rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Palavra-passe:</label>
          <input id="loginPassword" type="password" placeholder="••••••••" class="w-full bg-dark-custom border border-custom rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="button" onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-lg mt-2">
          Entrar na Conta
        </button>
      </div>

      <!-- Formulário de Registo -->
      <div id="formRegister" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Apelido / Nome:</label>
          <input id="regNickname" type="text" placeholder="Ex: Vinicius Moreira" class="w-full bg-dark-custom border border-custom rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">E-mail:</label>
          <input id="regEmail" type="email" placeholder="seu@email.com" class="w-full bg-dark-custom border border-custom rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Palavra-passe:</label>
          <input id="regPassword" type="password" placeholder="••••••••" class="w-full bg-dark-custom border border-custom rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="button" onclick="handleRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-lg mt-2">
          Registar e Entrar
        </button>
      </div>
    </div>
  </div>

  <!-- Header / Navbar -->
  <header class="border-b border-custom bg-card-custom py-4 px-6 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-play-circle text-indigo-500 text-3xl"></i>
      <h1 class="text-xl font-bold tracking-wide text-white">M.Y.<span class="text-indigo-400">MidiaStream</span></h1>
    </div>

    <!-- Utilizador & Apelido Editável -->
    <div class="flex items-center gap-2.5 bg-dark-custom px-3 py-1.5 rounded-lg border border-custom">
      <i class="fa-solid fa-user text-gray-400"></i>
      <span id="displayNickname" class="text-sm font-semibold text-white">Visitante</span>
      <button onclick="editMyNickname()" title="Editar Apelido" class="text-gray-400 hover:text-indigo-400 text-xs ml-1">
        <i class="fa-solid fa-pen"></i>
      </button>
      <span id="proBadge" class="hidden bg-gradient-to-r from-amber-500 to-yellow-400 text-black text-xs font-extrabold px-2 py-0.5 rounded-full uppercase shadow ml-2">PRO</span>
    </div>

    <!-- Controles & Botão Pro -->
    <div class="flex items-center gap-3">
      <button onclick="toggleCinemaMode()" id="btnCinema" class="bg-card-custom border border-custom hover:border-indigo-500 text-gray-300 hover:text-white text-xs py-2 px-3 rounded-lg transition flex items-center gap-1.5" title="Modo Cinema">
        <i class="fa-solid fa-expand"></i> <span class="hidden md:inline">Modo Cinema</span>
      </button>
      <button id="btnBuyPro" onclick="openCheckoutModal()" class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-black font-semibold text-xs py-2 px-4 rounded-lg shadow-md transition flex items-center gap-2">
        <i class="fa-solid fa-crown"></i> Obter Plano PRO
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main id="mainContainer" class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300">

    <!-- Coluna Esquerda & Centro: Vídeo / Player YouTube -->
    <div id="leftColumn" class="lg:col-span-2 flex flex-col gap-4 transition-all duration-300">
      
      <!-- Seletor de Modo & Participantes -->
      <div class="flex flex-wrap justify-between items-center bg-card-custom p-1.5 rounded-xl border border-custom gap-2">
        <div class="flex flex-1 gap-1 min-w-[200px]">
          <button id="tabScreen" onclick="switchTab('screen')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-desktop"></i> Ecrãs em Direto
          </button>
          <button id="tabYoutube" onclick="switchTab('youtube')" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center gap-2">
            <i class="fa-brands fa-youtube text-red-500"></i> YouTube Sync <span class="text-[10px] bg-amber-500/20 text-amber-400 px-1 py-0.5 rounded border border-amber-500/30">PRO</span>
          </button>
        </div>
        <div class="px-3 py-1 bg-dark-custom rounded-lg border border-custom text-xs text-gray-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="roomParticipantsInfo">Sala Partilhada Ativa</span>
        </div>
      </div>

      <!-- Área de Exibição Principal -->
      <div id="displayArea" class="bg-card-custom border border-custom rounded-xl p-3 relative min-h-[400px] flex items-center justify-center overflow-hidden shadow-xl">
        
        <!-- View 1: Grelha de Transmissões -->
        <div id="screenView" class="w-full h-full grid grid-cols-1 md:grid-cols-2 gap-3 items-center justify-center w-full">
          
          <!-- O seu Ecrã -->
          <div id="localVideoContainer" class="relative bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center min-h-[220px] border border-custom">
            <span id="localStreamLabel" class="absolute top-2 left-2 bg-black/70 text-indigo-300 text-[11px] px-2.5 py-0.5 rounded backdrop-blur z-10 font-semibold">O seu Ecrã (Você)</span>
            <button onclick="toggleVideoFullscreen('localVideo')" class="absolute top-2 right-2 bg-black/70 hover:bg-black text-white text-xs px-2 py-1 rounded backdrop-blur z-10" title="Tela Cheia">
              <i class="fa-solid fa-expand"></i>
            </button>
            <video id="localVideo" autoplay playsinline muted class="w-full max-h-[350px] object-contain hidden"></video>
            <div id="localPlaceholder" class="text-center p-4 text-gray-500 text-xs">
              <i class="fa-solid fa-desktop text-4xl mb-2 text-gray-600"></i>
              <p>A sua transmissão está desligada</p>
            </div>
          </div>

          <!-- Ecrã do Participante -->
          <div id="remoteVideoContainer" class="relative bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center min-h-[220px] border border-custom">
            <span id="remoteStreamLabel" class="absolute top-2 left-2 bg-black/70 text-emerald-300 text-[11px] px-2.5 py-0.5 rounded backdrop-blur z-10 font-semibold">Participante (Aguardando...)</span>
            <button onclick="toggleVideoFullscreen('remoteVideo')" class="absolute top-2 right-2 bg-black/70 hover:bg-black text-white text-xs px-2 py-1 rounded backdrop-blur z-10" title="Tela Cheia">
              <i class="fa-solid
