<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.Y.MidiaStream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #38bdf8;
      text-align: center;
    }
    .card {
      background: #334155;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    /* Estilo do Apelido */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nickname-display {
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .nickname-display:hover {
      background: #475569;
    }
    .nickname-input {
      font-size: 1.1rem;
      padding: 4px 8px;
      background: #0f172a;
      color: #fff;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      outline: none;
    }
    .badge-pro {
      background: #eab308;
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-free {
      background: #64748b;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Estilos de Configurações de Transmissão */
    .setting-group {
      margin-bottom: 12px;
    }
    .setting-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
    }
    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Botões de Ação */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pay {
      background: #22c55e;
      color: white;
    }
    .btn-pay:hover {
      background: #16a34a;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
      color: #a855f7;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>M.Y.MidiaStream</h1>

    <!-- 1. PERFIL E ALTERAÇÃO DE APELIDO -->
    <div class="card">
      <h2>Perfil do Usuário</h2>
      <div class="profile-section">
        <span id="nicknameContainer" class="nickname-display" title="Clique para alterar seu apelido">
          <span id="nicknameText">Carregando...</span>
          <span id="proBadge" class="badge-free">Básico</span>
        </span>
      </div>
      <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px;">
        * Clique no apelido acima para alterar (Exclusivo Pro).
      </p>
    </div>

    <!-- 2. CONFIGURAÇÕES DE COMPARTILHAMENTO DE TELA -->
    <div class="card">
      <h2>Configurações de Compartilhamento de Tela</h2>
      
      <div class="setting-group">
        <label for="resSelect">Resolução:</label>
        <select id="resSelect" disabled>
          <option value="720p">720p HD (Padrão)</option>
          <option value="1080p">1080p Full HD (Pro)</option>
          <option value="4k">4K Ultra HD (Pro)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="fpsSelect">Taxa de Quadros (FPS):</label>
        <select id="fpsSelect" disabled>
          <option value="30">30 FPS (Padrão)</option>
          <option value="60">60 FPS (Pro)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="bitrateSelect">Qualidade de Bitrate:</label>
        <select id="bitrateSelect" disabled>
          <option value="standard">Padrão</option>
          <option value="high">Alta Qualidade (Pro)</option>
        </select>
      </div>
    </div>

    <!-- 3. ATIVAÇÃO AUTOMÁTICA PRO (SIMULAÇÃO DE PAGAMENTO) -->
    <div class="card">
      <h2>Assinatura Pro</h2>
      <button id="btnSimulatePayment" class="btn btn-pay">Assinar Pro (Simular Pagamento Confirmado)</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <script>
    // Estado do Usuário
    let userState = {
      name: "Usuário M.Y.",
      nickname: "Usuário M.Y.",
      isPro: false,
      screenShare: {
        resolution: "720p",
        fps: "30",
        bitrate: "standard"
      }
    };

    // Elementos do DOM
    const nicknameContainer = document.getElementById('nicknameContainer');
    const nicknameText = document.getElementById('nicknameText');
    const proBadge = document.getElementById('proBadge');
    
    const resSelect = document.getElementById('resSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const bitrateSelect = document.getElementById('bitrateSelect');
    
    const btnSimulatePayment = document.getElementById('btnSimulatePayment');
    const statusMsg = document.getElementById('statusMsg');

    // Atualiza a Interface de acordo com o Estado
    function renderUI() {
      nicknameText.textContent = userState.nickname;
      
      if (userState.isPro) {
        proBadge.textContent = "PRO";
        proBadge.className = "badge-pro";
        
        // Desbloqueia opções Pro
        resSelect.disabled = false;
        fpsSelect.disabled = false;
        bitrateSelect.disabled = false;
        
        btnSimulatePayment.style.display = "none";
        statusMsg.textContent = "Benefício Pro ativo com sucesso!";
      } else {
        proBadge.textContent = "Básico";
        proBadge.className = "badge-free";
        
        resSelect.disabled = true;
        fpsSelect.disabled = true;
        bitrateSelect.disabled = true;
      }

      resSelect.value = userState.screenShare.resolution;
      fpsSelect.value = userState.screenShare.fps;
      bitrateSelect.value = userState.screenShare.bitrate;
    }

    // Funcionalidade 1: Alterar Apelido no Pro ao Clicar
    nicknameContainer.addEventListener('click', () => {
      if (!userState.isPro) {
        alert("A alteração de apelido é um recurso exclusivo do Benefício Pro!");
        return;
      }

      const input = document.createElement('input');
      input.type = 'text';
      input.value = userState.nickname;
      input.className = 'nickname-input';

      nicknameContainer.replaceWith(input);
      input.focus();

      const saveNickname = () => {
        const newNick = input.value.trim();
        if (newNick) {
          userState.nickname = newNick;
        }
        input.replaceWith(nicknameContainer);
        renderUI();
      };

      input.addEventListener('blur', saveNickname);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveNickname();
      });
    });

    // Funcionalidade 2: Salvar Configurações de Compartilhamento de Tela
    [resSelect, fpsSelect, bitrateSelect].forEach(select => {
      select.addEventListener('change', () => {
        userState.screenShare.resolution = resSelect.value;
        userState.screenShare.fps = fpsSelect.value;
        userState.screenShare.bitrate = bitrateSelect.value;
      });
    });

    // Funcionalidade 3: Ativação Automática de Pagamento
    function activateProAutomatically() {
      statusMsg.textContent = "Processando confirmação de pagamento...";
      setTimeout(() => {
        userState.isPro = true;
        renderUI();
      }, 1500);
    }

    btnSimulatePayment.addEventListener('click', activateProAutomatically);

    // Inicialização
    renderUI();
  </script>
</body>
</html>
